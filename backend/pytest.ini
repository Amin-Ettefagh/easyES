[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
# The repo ships models without committed migration files (migrations are
# generated at container start — see backend/entrypoint.sh). --no-migrations
# tells pytest-django to build the test schema directly from the current
# models, so the suite runs without any generated migrations present.
addopts = -q --no-migrations
